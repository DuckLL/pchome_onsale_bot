[project]
name = "pchome-onsale-bot"
version = "2.0.0"
description = "PChome 24h 降價通知 Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[job-queue]>=22.5,<23",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
